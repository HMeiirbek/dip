version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: dip_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  coturn:
    image: coturn/coturn:latest
    container_name: dip_coturn
    restart: always
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--user=dip_user:dip_password"
      - "--realm=dip.local"
      - "--verbose"

volumes:
  pgdata:
